<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; background: #FAF7F2; color: #241F1A; }
    .screen { width: 390px; display: flex; flex-direction: column; }
    .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #E4DCD1; background: #FFFFFF; }
    .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; font-family: 'Newsreader', Georgia, serif; }
    .pad { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .receipt { background: #FFFFFF; border: 1px solid #E4DCD1; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .receipt .order-id { font-size: 13px; font-weight: 600; }
    .receipt .date { font-size: 11px; color: #8A7F72; }
    .rline { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #E4DCD1; }
    .rline.net { font-weight: 700; font-size: 15px; border-bottom: none; padding-top: 8px; border-top: 1px solid #E4DCD1; }
    .new-sale-btn { width: 100%; height: 48px; border-radius: 8px; border: 1px solid #241F1A; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; background: #FFFFFF; }
  </style>
</helmet>
<div class="screen">
  <div class="topbar"><h1>Sale confirmed</h1></div>
  <div class="pad">
    <div class="receipt">
      <span class="order-id">Order OP-1043</span>
      <span class="date">04 ก.ย. 2569, 14:22</span>
      <div class="rline"><span>Round-cut pendant × 1</span><span>฿890</span></div>
      <div class="rline"><span>Studded hoop earrings × 2</span><span>฿840</span></div>
      <div class="rline"><span>Layered chain bracelet × 1</span><span>฿650</span></div>
      <div class="rline"><span>Discount</span><span>−฿238</span></div>
      <div class="rline"><span>Shipping</span><span>฿45</span></div>
      <div class="rline net"><span>Net total</span><span>฿2,187</span></div>
    </div>
    <span class="new-sale-btn">New sale</span>
  </div>
</div>
</x-dc>
</body>
</html>
