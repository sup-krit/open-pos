<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Open POS system architecture</title>
      <desc id="architecture-desc">Architecture diagram showing staff and public checkout-link browsers reaching a Next.js frontend on Vercel, which calls a FastAPI backend that reads and writes Supabase Postgres, Auth, and Storage, with an optional non-blocking call to a messaging platform API and locally generated PromptPay QR codes.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: Supabase (drawn before arrows and nodes) -->
        <rect x="720" y="108" width="240" height="288" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="804" y="112" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="121" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SUPABASE</text>

        <!-- Editorial callout: PromptPay -->
        <text x="280" y="40" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif">PromptPay QR generated locally — no payment gateway</text>
        <path d="M 610 48 Q 600 130 580 208" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="580" cy="212" r="2" fill="#2d3142"/>

        <!-- Arrows (behind boxes) -->
        <line x1="200" y1="260" x2="240" y2="260" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="440" y1="260" x2="480" y2="260" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Backend -> Postgres (right+up elbow) -->
        <path d="M 680,236 H 702 Q 710,236 710,228 V 180 Q 710,172 718,172 H 740"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Backend -> Auth (straight, same y) -->
        <line x1="680" y1="260" x2="740" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Backend -> Storage (right+down elbow) -->
        <path d="M 680,284 H 702 Q 710,284 710,292 V 340 Q 710,348 718,348 H 740"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Backend -> Messaging (dashed, optional/async) -->
        <line x1="580" y1="308" x2="580" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="200" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <rect x="440" y="240" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="249" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

        <rect x="716" y="200" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="726" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">R/W</text>

        <rect x="688" y="242" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="710" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">VERIFY</text>

        <rect x="716" y="326" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="726" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">R/W</text>

        <rect x="588" y="326" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NOTIFY</text>

        <!-- Node: Client Browser (Input/User) -->
        <rect x="40" y="212" width="160" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="212" width="160" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="231" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="120" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client Browser</text>
        <text x="120" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Staff POS + Admin</text>
        <text x="120" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Public checkout link</text>

        <!-- Node: Frontend -->
        <rect x="240" y="212" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="212" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="262" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="340" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
        <text x="340" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js · App Router</text>
        <text x="340" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vercel · Tailwind CSS</text>

        <!-- Node: Backend API (focal) -->
        <rect x="480" y="212" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="212" width="200" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="488" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="502" y="231" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="580" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
        <text x="580" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · Python</text>
        <text x="580" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">host: TBD</text>

        <!-- Node: Postgres (store) -->
        <rect x="740" y="140" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="140" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="748" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="762" y="157" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
        <text x="830" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <text x="830" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">business data</text>

        <!-- Node: Supabase Auth (store) -->
        <rect x="740" y="228" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="228" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="748" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="762" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="830" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Auth</text>
        <text x="830" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staff login · roles</text>

        <!-- Node: Supabase Storage (store) -->
        <rect x="740" y="316" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="740" y="316" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="748" y="324" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="762" y="333" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="830" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Storage</text>
        <text x="830" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">images · PDFs · labels</text>

        <!-- Node: Messaging Platform API (optional/async) -->
        <rect x="480" y="356" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="356" width="200" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="488" y="366" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="502" y="375" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
        <text x="580" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Messaging Platform API</text>
        <text x="580" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. Instagram DM</text>
        <text x="580" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optional · non-blocking</text>

        <!-- Legend strip -->
        <line x1="40" y1="492" x2="960" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="524" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / integration point</text>

        <rect x="230" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="250" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Frontend service</text>

        <rect x="390" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="410" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

        <rect x="500" y="524" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="520" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client / user</text>

        <rect x="620" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="640" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optional / async</text>

        <line x1="760" y1="529" x2="788" y2="529" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="796" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS / API call</text>
      </svg>
