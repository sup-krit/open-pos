<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Sale Flow · Open POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Open POS</p>
    <h1>Counter sale flow (iPhone / iPad, no dedicated hardware)</h1>

    <svg viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pos-sale-flow-title pos-sale-flow-desc">
      <title id="pos-sale-flow-title">POS counter sale flow</title>
      <desc id="pos-sale-flow-desc">Flowchart of a staff-run counter sale on the Open POS iOS PWA: search and add items in a loop, apply promotions, choose shipping and payment, compute totals, confirm the sale to create the order, and show an on-screen e-receipt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn first, behind nodes) ============ -->

      <!-- Start -> Search -->
      <line x1="500" y1="88" x2="500" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Search -> Add to cart -->
      <line x1="500" y1="180" x2="500" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Add to cart -> Decision -->
      <line x1="500" y1="272" x2="500" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Decision NO (continue) -> Promotions -->
      <line x1="500" y1="388" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Promotions -> Shipping & payment -->
      <line x1="500" y1="484" x2="500" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Shipping & payment -> Compute totals -->
      <line x1="500" y1="584" x2="500" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Compute totals -> Confirm sale -->
      <line x1="500" y1="684" x2="500" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Confirm sale -> Receipt (coral, happy path) -->
      <line x1="500" y1="776" x2="500" y2="812" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Decision YES (add more) -> back to Search, rounded elbow loop -->
      <path d="M 400 340 H 256 A 8 8 0 0 0 248 332 V 160 A 8 8 0 0 0 256 152 H 420"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ ARROW LABELS (masked, 6-10px gap above stroke) ============ -->

      <rect x="508" y="398" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTINUE</text>

      <rect x="508" y="788" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="798" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>

      <rect x="292" y="318" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADD MORE</text>

      <!-- ============ NODES ============ -->

      <!-- Start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open Sell screen</text>
      <text x="500" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staff · iPhone / iPad</text>

      <!-- Step: Search item -->
      <rect x="420" y="124" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Search item</text>
      <text x="500" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by name / SKU</text>
      <text x="500" y="176" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">camera scan optional</text>

      <!-- Step: Add to cart -->
      <rect x="420" y="216" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add item to cart</text>

      <!-- Decision: Add more items? -->
      <polygon points="500,292 600,340 500,388 400,340" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="336" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add more</text>
      <text x="500" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">items?</text>

      <!-- Step: Promotions -->
      <rect x="420" y="420" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apply promotions</text>
      <text x="500" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto-applied +</text>
      <text x="500" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manual select</text>

      <!-- Step: Shipping & payment -->
      <rect x="420" y="520" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shipping &amp; payment</text>
      <text x="500" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ship type · default cost</text>
      <text x="500" y="575" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PromptPay QR / card</text>

      <!-- Step: Compute totals -->
      <rect x="420" y="620" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="648" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Compute totals</text>
      <text x="500" y="663" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">subtotal − discount</text>
      <text x="500" y="675" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ shipping = net</text>

      <!-- Step: Confirm sale (focal coral) -->
      <rect x="420" y="720" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="745" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Confirm sale</text>
      <text x="500" y="760" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">order created</text>

      <!-- End oval: e-receipt -->
      <rect x="420" y="812" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="833" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Show e-receipt</text>
      <text x="500" y="848" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on-screen · not printed</text>

      <!-- ============ ANNOTATION CALLOUT ============ -->
      <text x="956" y="90" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">iOS PWA</text>
      <text x="956" y="108" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">limited offline support</text>
      <path d="M 880 116 Q 760 420, 608 748" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="608" cy="748" r="2" fill="#2d3142"/>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="900" x2="960" y2="900" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="916" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="932" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="942" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="192" y="932" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="224" y="942" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="324,938 336,932 348,938 336,944" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="942" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <line x1="472" y1="940" x2="500" y2="940" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="508" y="942" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Order created (happy path)</text>

      <line x1="740" y1="940" x2="768" y2="940" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="776" y="942" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Editorial note</text>
    </svg>
  </div>
</body>
</html>
