<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock screen inventory workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Open POS</p>
    <h1>Inventory / stock management flow</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inventory-flow-title inventory-flow-desc">
      <title id="inventory-flow-title">Stock screen inventory workflow</title>
      <desc id="inventory-flow-desc">Flowchart showing how staff add new products or edit existing items on the Stock screen, with item status auto-derived from stock-level thresholds after every save and the table filterable by group, variant, status, or vendor.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (drawn first, behind nodes) ===== -->

      <!-- Start -> Decision -->
      <line x1="500" y1="88" x2="500" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Decision -> Add new (right) -->
      <line x1="600" y1="188" x2="700" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="618" y="168" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADD NEW</text>

      <!-- Decision -> Edit existing (left) -->
      <line x1="400" y1="188" x2="300" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="302" y="168" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="350" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT EXISTING</text>

      <!-- Add-rect -> merge dot (rounded elbow) -->
      <path d="M 800 232 L 800 264 Q 800 272 792 272 L 504 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Edit-rect -> merge dot (rounded elbow) -->
      <path d="M 200 232 L 200 264 Q 200 272 208 272 L 496 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- merge dot -> Status (auto) -->
      <line x1="500" y1="276" x2="500" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Status -> Filter/search (side branch) -->
      <line x1="600" y1="348" x2="760" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="624" y="328" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FILTER / SEARCH</text>

      <!-- Status -> End -->
      <line x1="500" y1="380" x2="500" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->

      <!-- Start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Open Stock screen</text>

      <!-- Decision diamond -->
      <polygon points="500,140 600,188 500,236 400,188" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="184" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add new or</text>
      <text x="500" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">edit existing?</text>

      <!-- Add new product -->
      <rect x="700" y="144" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add new product</text>
      <text x="800" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sku · group · variant · lot</text>
      <text x="800" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cost · price · vendor · custom</text>
      <text x="800" y="216" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fill fields directly → save</text>

      <!-- Edit existing item -->
      <rect x="100" y="144" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edit existing item</text>
      <text x="200" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">double-click cell →</text>
      <text x="200" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inline input → confirm</text>
      <text x="200" y="216" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ saved</text>

      <!-- merge point -->
      <circle cx="500" cy="272" r="4" fill="#2d3142"/>

      <!-- Status auto-derived (focal) -->
      <rect x="400" y="316" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="316" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Status auto-derived</text>
      <text x="500" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in stock · low · out of stock</text>
      <text x="500" y="370" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(not a manual field)</text>

      <!-- Filter / search side node -->
      <rect x="760" y="316" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filter / search table</text>
      <text x="860" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by group/variant/status/vendor</text>

      <!-- End oval -->
      <rect x="420" y="420" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">End</text>

      <!-- ===== Editorial callout ===== -->
      <text x="960" y="48" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">id columns stay fixed width</text>
      <path d="M 960 56 C 940 150 920 250 860 312" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="860" cy="316" r="2" fill="#2d3142"/>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="552" x2="960" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="584" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="220" y="584" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="392,590 404,584 416,590 404,596" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="428" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <circle cx="536" cy="590" r="4" fill="#2d3142"/>
      <text x="552" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge point</text>

      <rect x="700" y="584" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="732" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Automatic (system-derived)</text>
    </svg>
  </div>
</body>
</html>
