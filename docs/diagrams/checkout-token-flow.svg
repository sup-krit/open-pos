<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checkout-token-flow-title checkout-token-flow-desc">
      <title id="checkout-token-flow-title">Order checkout &amp; address-token flow</title>
      <desc id="checkout-token-flow-desc">Sequence diagram showing staff creating an order that generates a checkout link and payment QR, sharing that link with a customer who opens it, has the token validated as not expired, submits a shipping address, and pays by scanning a PromptPay QR outside the system.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- =================================================================
           LIFELINES — Staff=104, Frontend=328, Backend=552, Database=776, Customer=1000
           ================================================================= -->
      <line x1="104"  y1="128" x2="104"  y2="840" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="328"  y1="128" x2="328"  y2="840" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="552"  y1="128" x2="552"  y2="840" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="776"  y1="128" x2="776"  y2="840" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1000" y1="128" x2="1000" y2="840" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           ACTIVATION BARS
           ================================================================= -->
      <rect x="324" y="176" width="8" height="208" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="324" y="464" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="548" y="224" width="8" height="104" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="548" y="560" width="8" height="72"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="548" y="736" width="8" height="72"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="772" y="272" width="8" height="24"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="772" y="608" width="8" height="24"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="772" y="784" width="8" height="24"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- =================================================================
           COMBINED FRAGMENT — opt [NOT EXPIRED], spans Frontend–Backend–Database
           ================================================================= -->
      <rect x="280" y="480" width="544" height="168" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="280" y="480" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="300" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="292" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[NOT EXPIRED]</text>

      <!-- =================================================================
           MESSAGE ARROWS — time flows top→down
           ================================================================= -->
      <!-- M1 Staff → Frontend (submit form) -->
      <line x1="104" y1="176" x2="328" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2 Frontend → Backend (create order, HTTP) -->
      <line x1="328" y1="224" x2="552" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M3 Backend → Database (insert order + token) -->
      <line x1="552" y1="272" x2="776" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 Backend → Frontend (return: link + QR) -->
      <line x1="552" y1="320" x2="332" y2="320" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <!-- M5 Frontend → Staff (headline success: link + QR shown) -->
      <line x1="328" y1="368" x2="108" y2="368" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- M6 Staff → Customer (share link, outside system, one-way) -->
      <line x1="104" y1="416" x2="1000" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M7 Customer → Frontend (open checkout link) -->
      <line x1="1000" y1="464" x2="328" y2="464" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M8 Frontend → Backend (validate token) [in fragment] -->
      <line x1="328" y1="560" x2="552" y2="560" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M9 Backend → Database (lookup by token + expiry) [in fragment] -->
      <line x1="552" y1="608" x2="776" y2="608" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M10 Customer → Frontend (submit address) -->
      <line x1="1000" y1="688" x2="328" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M11 Frontend → Backend (patch order address) -->
      <line x1="328" y1="736" x2="552" y2="736" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M12 Backend → Database (save address) -->
      <line x1="552" y1="784" x2="776" y2="784" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- =================================================================
           MESSAGE LABELS — masked, 8px gap above stroke
           ================================================================= -->
      <rect x="176" y="156" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT FORM</text>

      <rect x="398" y="204" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="214" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /ORDERS</text>

      <rect x="622" y="252" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT+TOKEN</text>

      <rect x="400" y="300" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="310" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">201 LINK+QR</text>

      <rect x="180" y="348" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="358" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS+QR</text>

      <rect x="516" y="396" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHARE LINK</text>

      <rect x="630" y="444" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="454" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN LINK</text>

      <rect x="392" y="540" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="550" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE TOKEN</text>

      <rect x="620" y="588" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="598" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP+EXPIRY</text>

      <rect x="616" y="668" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="678" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT ADDRESS</text>

      <rect x="396" y="716" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="440" y="726" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATCH ADDRESS</text>

      <rect x="622" y="764" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="774" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE ADDRESS</text>

      <!-- =================================================================
           ACTOR BOXES — drawn after arrows/labels. Centers: 104, 328, 552, 776, 1000
           ================================================================= -->
      <!-- Staff (human / input) -->
      <rect x="32" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="40" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="54" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="104" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Staff</text>
      <text x="104" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-store</text>

      <!-- Frontend (Next.js) -->
      <rect x="256" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="264" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="280" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="328" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend</text>
      <text x="328" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js</text>

      <!-- Backend (FastAPI) -->
      <rect x="480" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="488" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="502" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="552" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend</text>
      <text x="552" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <!-- Database (Supabase Postgres) -->
      <rect x="704" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="712" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="724" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="776" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
      <text x="776" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Supabase PG</text>

      <!-- Customer (human / input) -->
      <rect x="928" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="928" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="936" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="950" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="1000" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Customer</text>
      <text x="1000" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own device</text>

      <!-- =================================================================
           CALLOUT — PromptPay QR payment happens outside the system
           ================================================================= -->
      <text x="1000" y="872" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Customer pays by scanning a PromptPay QR — outside</text>
      <text x="1000" y="890" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the system; no payment gateway integration.</text>
      <path d="M 1000 856 Q 1010 848 1000 842" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1000" cy="840" r="2" fill="#2d3142"/>

      <!-- =================================================================
           LEGEND
           ================================================================= -->
      <line x1="32" y1="908" x2="1068" y2="908" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="924" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="32" y="940" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="52" y="948" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Person actor</text>

      <rect x="232" y="940" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="948" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">System component</text>

      <rect x="452" y="940" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="472" y="948" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

      <line x1="632" y1="945" x2="660" y2="945" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="668" y="948" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API call</text>

      <line x1="852" y1="945" x2="880" y2="945" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="888" y="948" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

    </svg>
